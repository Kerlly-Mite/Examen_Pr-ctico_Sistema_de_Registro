# Infraestructura local del proyecto "Postulación Directorio BIESS":
#   - PostgreSQL 16 : persistencia relacional (postulantes, postulaciones, catálogos)
#   - Redis alpine  : bloqueo por intentos fallidos (EF-11) y caché de catálogos
# El backend (Go) y el frontend (Vite) se ejecutan en tu máquina; ver README.md.
# Los valores salen del archivo .env (copia de .env.example). Puertos distintos a los del
# Multicatalogo (5433 y 6380) para poder tener ambos proyectos levantados a la vez.
services:
  db:
    image: postgres:16
    container_name: biess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-biess_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biess_pass}
      POSTGRES_DB: ${DB_NAME:-biess_postulacion}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Todos los .sql de esta carpeta corren en orden alfabético (01 esquema, 02 catálogos, 03 simulados)
      # solo la PRIMERA vez (volumen vacío). Para reiniciar la BD: docker compose down -v
      - ./backend/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-biess_user} -d ${DB_NAME:-biess_postulacion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: biess_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
